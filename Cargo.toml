[package]
name = "medrec-cli"
description = "A household's medical records in a plain Drive folder: people, intake of scans and files with local OCR, imaging studies, provider and insurer imports, timelines, search and notes."
version = "0.8.2"
edition = "2021"
# pk-cli-drive needs 1.89 (`File::lock`).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/own-your-health/medrec-cli"
authors = ["piekstra"]
publish = false

[lib]
name = "medrec"
path = "src/lib.rs"

[[bin]]
name = "medrec"
path = "src/main.rs"

[dependencies]
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.6" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.6" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.6" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.6" }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.6" }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.6" }
pk-cli-drive = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.6", features = ["google"] }
# `medrec mcp`: read-only tools over stdio for Claude Desktop and Claude Code.
# No `http` feature: the records are served to a local client only.
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.6", features = ["stdio"] }
schemars = "1"
pk-med-records = { git = "https://github.com/own-your-health/medical-common", tag = "v0.6.6" }
# test-util: the synthetic study writer, which testdata.rs and the synth
# example use in normal builds.
pk-med-dicom = { git = "https://github.com/own-your-health/medical-common", tag = "v0.6.6", features = ["test-util"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
regex = "1"

[dev-dependencies]
# The fake Google Drive server the store tests run against; no network.
pk-cli-drive = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.6", features = ["fake-google"] }
pk-cli-mcp = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.6", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"
# Follows the fake Drive server's consent in the store tests' sign-in.
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }

[profile.release]
strip = true
lto = true
opt-level = 3
