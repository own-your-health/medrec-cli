name: release

# Cut a release by pushing a tag like `v0.1.0`. One macOS job (Apple Silicon,
# cross-compiling the Intel target) and one Linux job; medrec builds for no
# other OS. Build jobs are independent (fail-fast: false); only `publish`,
# which runs on a tag alone and runs no build code, can write to the
# repository. It attaches whatever was built to a draft and publishes the
# draft only once every expected asset is there, so `self-update` never finds
# a half release.
#
# Beside the tarballs it publishes `medrec-<version>.mcpb`, the Claude
# Desktop extension (`medrec mcp`), holding one universal macOS binary and
# the Linux one; Desktop picks a binary by OS, not by CPU.
#
# A pull request that changes how releases are built, or the dependencies
# and version, runs every job but `publish` as a dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/mcpb/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  versions:
    name: check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag and Cargo.toml agree
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          manifest_version=$(jq -r .version packaging/mcpb/manifest.json)
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::packaging/mcpb/manifest.json is $manifest_version but Cargo.toml is $version"
            exit 1
          fi

  build:
    name: build ${{ matrix.name }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: apple (aarch64 + x86_64)
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-latest
            name: linux x86_64
            targets: "x86_64-unknown-linux-gnu"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Asset names are the contract `medrec self-update` resolves against:
      # medrec-<target>.tar.gz plus a sibling .sha256. The bare binaries also
      # go to bin/<target>/ for the .mcpb job.
      - name: Build and package each target
        run: |
          set -euo pipefail
          sha256() { if command -v shasum >/dev/null; then shasum -a 256 "$1"; else sha256sum "$1"; fi; }
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --locked --target "$t"
            tar -C "target/$t/release" -czf "medrec-$t.tar.gz" medrec
            sha256 "medrec-$t.tar.gz" > "medrec-$t.tar.gz.sha256"
            mkdir -p "bin/$t"
            cp "target/$t/release/medrec" "bin/$t/"
          done
      # A binary that builds and then fails at startup is not published.
      # The x86_64 macOS slice cannot run on this arm64 runner.
      - name: Run what this runner can run
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) b=target/aarch64-apple-darwin/release/medrec ;;
            *) b=target/x86_64-unknown-linux-gnu/release/medrec ;;
          esac
          "$b" --version
          "$b" info --json > /dev/null
          "$b" mcp --list-tools > /dev/null
      - name: Universal macOS binary
        if: runner.os == 'macOS'
        run: |
          mkdir -p bin/universal-apple-darwin
          lipo -create -output bin/universal-apple-darwin/medrec \
            bin/aarch64-apple-darwin/medrec bin/x86_64-apple-darwin/medrec
          lipo -info bin/universal-apple-darwin/medrec
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ runner.os }}
          path: bin/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            medrec-*.tar.gz
            medrec-*.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  mcpb:
    name: pack the Claude Desktop extension
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The `versions` job has already held the manifest to Cargo.toml and
      # the tag.
      - name: Assemble, validate and pack
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          stage="$RUNNER_TEMP/medrec"
          mkdir -p "$stage/server/linux"
          cp packaging/mcpb/manifest.json LICENSE-MIT "$stage/"
          cp bin/universal-apple-darwin/medrec "$stage/server/medrec"
          cp bin/x86_64-unknown-linux-gnu/medrec "$stage/server/linux/medrec"
          # Artifacts drop the executable bit; the .mcpb keeps what it is given.
          chmod +x "$stage/server/medrec" "$stage/server/linux/medrec"
          npx -y @anthropic-ai/mcpb@2.1.2 validate "$stage/manifest.json"
          npx -y @anthropic-ai/mcpb@2.1.2 pack "$stage" "medrec-$version.mcpb"
          sha256sum "medrec-$version.mcpb" > "medrec-$version.mcpb.sha256"
          unzip -Z "medrec-$version.mcpb"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mcpb
          path: medrec-*.mcpb*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [versions, build, mcpb]
    if: ${{ !cancelled() && needs.versions.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            dist/medrec-*.tar.gz
            dist/medrec-*.tar.gz.sha256
            dist/medrec-*.mcpb
            dist/medrec-*.mcpb.sha256
          generate_release_notes: true
      - name: Every expected asset was attached
        run: |
          set -euo pipefail
          missing=0
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            for f in "medrec-$t.tar.gz" "medrec-$t.tar.gz.sha256"; do
              [ -f "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
            done
          done
          version="${GITHUB_REF_NAME#v}"
          for f in "medrec-$version.mcpb" "medrec-$version.mcpb.sha256"; do
            [ -f "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          exit "$missing"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run of an older tag must not move Latest back to it.
          current=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "$current" "$GITHUB_REF_NAME" | sort -V | tail -1)
          latest=false; [ "$newest" = "$GITHUB_REF_NAME" ] && latest=true
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
